<div class="pills">
  <span class="pill">env <strong>{{.MailerEnv}}</strong></span>
  {{if .MailerReady}}
    <span class="pill ok">mailer pronto</span>
  {{else}}
    <span class="pill bad">mailer indisponível</span>
  {{end}}
  {{if .QueueError}}
    <span class="pill bad" title="{{.QueueError}}">fila indisponível</span>
  {{else}}
    <span class="pill">na fila <strong>{{.Queue.Messages}}</strong></span>
    <span class="pill {{if eq .Queue.Consumers 0}}bad{{else}}ok{{end}}">consumidores <strong>{{.Queue.Consumers}}</strong></span>
  {{end}}
</div>
